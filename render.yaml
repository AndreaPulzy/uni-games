# Blueprint per Render: "New > Blueprint" puntando a questo repository.
services:
  - type: web
    name: uni-games
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Opzionale. Su Render non serve: il QR usa gia' il dominio della pagina.
      # Va compilato solo dietro un dominio personalizzato o un proxy che
      # cambia l'host visto dal browser.
      - key: PUBLIC_URL
        sync: false
    # Il piano free non supporta i dischi: l'archivio partite riparte da zero
    # a ogni deploy. Su un piano a pagamento, scommentare per conservarlo.
    # disk:
    #   name: uni-games-data
    #   mountPath: /app/server/data
    #   sizeGB: 1
