# Configurazione per Fly.io. Creare l'app con: fly launch --no-deploy
app = "uni-games"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # il gioco vive su connessioni WebSocket aperte: la macchina non deve spegnersi
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

# Archivio partite conservato tra i deploy
[[mounts]]
  source = "uni_games_data"
  destination = "/app/server/data"
